upload_max_filesize = 11M
post_max_size = 12M
max_file_uploads = 2
expose_php = Off
display_errors = Off
log_errors = On
session.use_strict_mode = 1
session.cookie_httponly = 1
date.timezone = America/Tegucigalpa
